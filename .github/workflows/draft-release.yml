name: Draft signed release assets

# 仅手动触发，不会在 push / PR 时运行。缺少正式签名时必须失败，
# 绝不把 debug 签名的 APK 当作更新资产上传。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "将要创建的 draft tag，例如 v0.2.4。请先在仓库中递增 versionCode。"
        required: true
        type: string
      notes:
        description: "写入 update.json 的一条更新说明"
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require official signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "缺少仓库 Secret：$name。拒绝生成正式更新资产。"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Write signing files
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf '%s\n' \
            "storeFile=$RUNNER_TEMP/release.jks" \
            "storePassword=$RELEASE_KEYSTORE_PASSWORD" \
            "keyAlias=$RELEASE_KEY_ALIAS" \
            "keyPassword=$RELEASE_KEY_PASSWORD" \
            > key.properties

      - name: Assemble signed release
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Reject debug signatures and build update.json
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SIGNER="$SDK/build-tools/34.0.0/apksigner"
          AAPT="$SDK/build-tools/34.0.0/aapt"
          CERTS="$("$SIGNER" verify --print-certs "$APK")"
          echo "$CERTS"
          if echo "$CERTS" | grep -Fq "CN=Android Debug"; then
            echo "检测到 debug 签名，拒绝作为正式更新资产。"
            exit 1
          fi
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          VERSION_NAME="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" "$RUNNER_TEMP/badging.txt" | head -n 1)"
          APK_NAMED="DeepRead-${VERSION_NAME}.apk"
          cp "$APK" "$APK_NAMED"
          STAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          python3 tools/update/generate_update_manifest.py \
            --apk "$APK_NAMED" \
            --from-aapt-badging "$RUNNER_TEMP/badging.txt" \
            --note "${{ inputs.notes }}" \
            --published-at "$STAMP" \
            --out update.json
          echo "APK_NAMED=$APK_NAMED" >> "$GITHUB_ENV"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag }}" "$APK_NAMED" update.json \
            --draft \
            --title "${{ inputs.tag }}" \
            --notes "${{ inputs.notes }}"
